<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>Drift: daily check-in</title>
<style>
:root{
  --bg:#0b1020;--bg2:#111833;--card:#151d3b;--card2:#1b2550;--line:#26315f;
  --text:#e9ecf8;--mute:#9aa3c7;--dim:#6b75a0;
  --calm:#6ee7c8;--sky:#7aa7ff;--warm:#ffc773;--hot:#ff8a7a;--violet:#b49cff;
  --r:20px;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#05070f;color:var(--text)}
body{display:flex;justify-content:center;align-items:flex-start}
#phone{position:relative;width:100%;max-width:430px;min-height:100vh;background:
  radial-gradient(120% 60% at 50% -10%,#1d2a63 0%,rgba(29,42,99,0) 60%),var(--bg);overflow:hidden}
@media(min-width:520px){body{align-items:center;padding:24px}#phone{min-height:844px;height:844px;max-width:390px;border-radius:44px;box-shadow:0 0 0 10px #161a2c,0 30px 80px rgba(0,0,0,.6)}}
.scroll{position:absolute;inset:0;overflow-y:auto;padding:18px 20px 104px}
.scroll.noTabs{padding-bottom:30px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
h1{font-size:28px;letter-spacing:-.02em;font-weight:700}
h2{font-size:20px;letter-spacing:-.01em;font-weight:650}
h3{font-size:15px;font-weight:600}
p{line-height:1.5;color:var(--mute);font-size:14.5px}
.small{font-size:12.5px;color:var(--dim)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.card{background:linear-gradient(180deg,var(--card),#131a36);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border-radius:16px;font-weight:650;font-size:16px;background:var(--calm);color:#062a22}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
.btn.soft{background:var(--card2);color:var(--text)}
.btn.warn{background:var(--hot);color:#2b0b06}
.btn:active{transform:scale(.98)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--card2);color:var(--mute)}
.demo{background:rgba(255,199,115,.14);color:var(--warm);border:1px solid rgba(255,199,115,.35)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;letter-spacing:-.01em}
.logo i{width:22px;height:22px;border-radius:50%;background:conic-gradient(from 200deg,var(--calm),var(--sky),var(--violet),var(--calm));display:block;box-shadow:0 0 18px rgba(110,231,200,.45)}
.help{font-size:12.5px;font-weight:600;color:var(--hot);border:1px solid rgba(255,138,122,.4);padding:6px 10px;border-radius:999px}
/* tabs */
#tabs{position:absolute;left:0;right:0;bottom:0;height:84px;padding:8px 14px 22px;display:flex;justify-content:space-around;background:rgba(11,16,32,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);z-index:5}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--dim);font-weight:600}
#tabs button svg{width:24px;height:24px}
#tabs button.on{color:var(--calm)}
/* toggles */
.tog{position:relative;width:50px;height:30px;border-radius:999px;background:#2a3463;flex:none;transition:.2s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.tog.on{background:var(--calm)}.tog.on::after{left:23px}
.list>div{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.list>div:last-child{border-bottom:0}
.ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;font-size:18px;background:var(--card2)}
.grow{flex:1;min-width:0}
/* gauge */
.gaugeWrap{position:relative;display:flex;justify-content:center}
.gaugeTxt{position:absolute;top:50px;text-align:center;width:100%}
.gaugeTxt b{font-size:48px;font-weight:700;letter-spacing:-.03em;display:block;line-height:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sig{padding:13px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.sig .v{font-size:19px;font-weight:650;margin-top:6px;letter-spacing:-.01em}
.sig .b{font-size:11.5px;color:var(--dim);margin-top:2px}
.bar{height:5px;border-radius:9px;background:#26315f;margin-top:10px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:9px}
.sig.off{opacity:.45}
/* nudge */
.nudge{position:relative;overflow:hidden;background:linear-gradient(135deg,#1e2c66,#1a2350 60%,#202a5c);border:1px solid #34408a}
.nudge::before{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,rgba(110,231,200,.25),transparent 70%)}
.toast{position:absolute;left:12px;right:12px;top:12px;z-index:20;padding:14px;border-radius:20px;background:rgba(32,40,80,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid #3a4690;box-shadow:0 12px 40px rgba(0,0,0,.5);transform:translateY(-140%);transition:transform .45s cubic-bezier(.2,.9,.3,1.2)}
.toast.show{transform:none}
/* mood */
.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.moods button{padding:14px 0 10px;border-radius:16px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--mute)}
.moods button span{font-size:28px}
.moods button.sel{border-color:var(--calm);background:#173a44;color:var(--text)}
/* circle */
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#0b1020;flex:none}
input{width:100%;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--bg2);color:var(--text);padding:0 14px;font:inherit;font-size:15px;outline:none}
input:focus{border-color:var(--sky)}
.bubble{background:#2b6cf6;color:#fff;border-radius:20px 20px 6px 20px;padding:12px 14px;font-size:14.5px;line-height:1.45;max-width:88%;margin-left:auto}
.phoneMock{background:#0e1430;border:1px solid var(--line);border-radius:18px;padding:14px}
/* crisis */
.crisis{background:radial-gradient(120% 70% at 50% 0%,#3a1630 0%,rgba(58,22,48,0) 70%),var(--bg)}
.big988{font-size:84px;font-weight:800;letter-spacing:-.04em;line-height:1;background:linear-gradient(180deg,#fff,#ffc9c0);-webkit-background-clip:text;background-clip:text;color:transparent}
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.works .bar{height:8px;margin-top:6px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.seg{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{flex:1;height:34px;border-radius:9px;font-size:13px;font-weight:600;color:var(--mute)}
.seg button.on{background:var(--card2);color:var(--text)}
.disclaim{font-size:11.5px;color:var(--dim);text-align:center;line-height:1.5;margin-top:18px}
</style>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/icon-192.png"><link rel="icon" href="icons/icon-192.png">
</head>
<body>
<div id="phone">
  <div id="view" class="scroll"></div>
  <div id="toast" class="toast"></div>
  <nav id="tabs"></nav>
</div>
<script>
(function(){
"use strict";
/* Drift: personal, non-clinical self-tracking. Everything is typed in by you and stays in this browser
   (localStorage). Nothing is sent anywhere. A web page can't read phone sensors, so you log once a day. */
var KEY="drift.v1",MIN_DAYS=5,WINDOW=28;
try{localStorage.removeItem("drift.prototype.v1")}catch(e){}
var SIGNALS=[
  {id:"bed",cat:"sleep",ico:"🌙",name:"Bedtime",unit:"time",scale:2.5,bad:"up",q:"What time did you go to sleep last night?"},
  {id:"wake",cat:"sleep",ico:"🌅",name:"Wake time",unit:"time",scale:2.5,bad:"up",q:"What time did you wake up today?"},
  {id:"screen",cat:"screen",ico:"📱",name:"Screen time",unit:"h",scale:3.5,bad:"up",q:"Screen time yesterday (hours, from Screen Time / Digital Wellbeing)",max:24,step:0.25},
  {id:"late",cat:"late",ico:"🕒",name:"After-midnight use",unit:"m",scale:70,bad:"up",q:"Minutes on your phone after midnight",max:600,step:5},
  {id:"social",cat:"apps",ico:"🌀",name:"Scrolling apps",unit:"h",scale:2.5,bad:"up",q:"Hours in social / scrolling apps yesterday",max:24,step:0.25},
  {id:"steps",cat:"steps",ico:"👟",name:"Steps",unit:"n",scale:5000,bad:"down",q:"Steps yesterday (from your phone's Health / Fit app)",max:100000,step:100},
  {id:"texts",cat:"texts",ico:"💬",name:"Texts returned",unit:"n",scale:7,bad:"down",q:"About how many people did you text back yesterday?",max:500,step:1},
  {id:"mood",cat:"mood",ico:"🙂",name:"Mood check-in",unit:"mood",scale:2.5,bad:"down"}
];
var CONSENTS=[
  {id:"sleep",ico:"🌙",t:"Sleep & wake times",d:"You enter two times a day. Nothing else."},
  {id:"screen",ico:"📱",t:"Total screen time",d:"You copy the daily total from Screen Time / Digital Wellbeing."},
  {id:"late",ico:"🕒",t:"Late-night phone use",d:"Your own estimate of minutes after midnight."},
  {id:"apps",ico:"🌀",t:"Scrolling apps",d:"Hours in social / scrolling apps. No app content."},
  {id:"steps",ico:"👟",t:"Step count",d:"The daily total from your Health or Fit app."},
  {id:"texts",ico:"💬",t:"How often you text back",d:"A rough count. Messages are never read."},
  {id:"mood",ico:"🙂",t:"Daily 1-tap mood check-in",d:"You choose how you feel, once a day."}
];
var NUDGES=[
  {id:"walk",ico:"🚶",t:"Take a 10-minute walk",rel:["steps","screen","social"],d:"Your steps are down from your usual. A short loop outside often resets the day."},
  {id:"call",ico:"📞",t:"Call someone you trust",rel:["texts","mood"],d:"You've been quieter with people than usual. A 5-minute call can help."},
  {id:"bed",ico:"🛏️",t:"Phone down by 11:30 tonight",rel:["bed","late","wake","screen"],d:"Your sleep moved later than your usual. An earlier night tends to make tomorrow easier."},
  {id:"meeting",ico:"🤝",t:"Check in with your group",rel:["mood","texts"],d:"Reach out to your sponsor, group or a meeting today, even a short one."}
];
var COLORS=["#6ee7c8","#7aa7ff","#b49cff","#ffc773"];

function defaults(){
  var c={};CONSENTS.forEach(function(x){c[x.id]=true});
  var ns={};NUDGES.forEach(function(n){ns[n.id]={done:0,skip:0}});
  return {onboarded:false,name:"",consents:c,logs:{},circle:[],nudgeStats:ns,activeNudge:null,nudgeLog:[],circleSent:"",circlePaused:false};
}
var S;
try{S=JSON.parse(localStorage.getItem(KEY))||defaults()}catch(e){S=defaults()}
(function(){var d=defaults();for(var k in d)if(S[k]===undefined)S[k]=d[k];NUDGES.forEach(function(n){if(!S.nudgeStats[n.id])S.nudgeStats[n.id]={done:0,skip:0}})})();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

function parseHash(){var h=location.hash.replace(/^#/,"").split("?")[0];return {route:h}}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function dkey(d){d=d||new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function daysAgo(n){var d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-n);return d}
var TODAY=dkey();
function todayLog(){return S.logs[TODAY]||{}}
function fmt(sig,v){
  if(v==null||isNaN(v))return "-";
  if(sig.unit==="time"){var h=((v%24)+24)%24,hh=Math.floor(h),mm=Math.round((h-hh)*60);if(mm===60){hh=(hh+1)%24;mm=0}var ap=hh>=12?"PM":"AM";var h12=hh%12||12;return h12+":"+(mm<10?"0":"")+mm+" "+ap}
  if(sig.unit==="h"){var H=Math.floor(v),M=Math.round((v-H)*60);if(M===60){H++;M=0}return H+"h "+M+"m"}
  if(sig.unit==="m")return Math.round(v)+" min";
  if(sig.unit==="mood")return ["","Really low","Low","Okay","Good","Great"][Math.round(v)]||"-";
  return Math.round(v).toLocaleString();
}
/* bedtimes after midnight count as 24+ so 1 AM is "later" than 11 PM */
function timeToNum(t,isBed){if(!t)return null;var p=t.split(":"),h=+p[0]+(+p[1]||0)/60;if(isBed&&h<12)h+=24;return h}
function numToTime(v){if(v==null)return "";var h=((v%24)+24)%24,hh=Math.floor(h),mm=Math.round((h-hh)*60);if(mm===60){hh=(hh+1)%24;mm=0}return ("0"+hh).slice(-2)+":"+("0"+mm).slice(-2)}
function active(){return SIGNALS.filter(function(s){return S.consents[s.cat]})}
function median(a){a=a.slice().sort(function(x,y){return x-y});var m=a.length>>1;return a.length%2?a[m]:(a[m-1]+a[m])/2}
function loggedDays(){return Object.keys(S.logs).filter(function(k){var l=S.logs[k];return l&&Object.keys(l).some(function(x){return l[x]!=null})}).sort()}
/* baseline = median of your own past entries (last 28 days, not counting the day being scored) */
function baseline(sig,excludeKey){
  var lo=dkey(daysAgo(WINDOW)),vals=[];
  Object.keys(S.logs).forEach(function(k){if(k===excludeKey||k<lo)return;var v=S.logs[k][sig.id];if(v!=null&&!isNaN(v))vals.push(+v)});
  return vals.length>=MIN_DAYS?median(vals):null;
}
function dev(sig,key){
  var l=S.logs[key||TODAY]||{},v=l[sig.id],b=baseline(sig,key||TODAY);
  if(v==null||b==null)return null;
  var d=(v-b)/sig.scale;if(sig.bad==="down")d=-d;return Math.max(0,Math.min(1,d));
}
function scoreFor(key){
  var a=active(),ds=[];a.forEach(function(s){var d=dev(s,key);if(d!=null)ds.push(d)});
  if(ds.length<2)return null;
  var base=ds.reduce(function(x,y){return x+y},0)/ds.length*100;
  var n=ds.filter(function(d){return d>=.5}).length;
  return Math.round(Math.max(0,Math.min(100,base+(n>=3?12:0))));
}
function driftScore(){return scoreFor(TODAY)}
function drifting(){return active().filter(function(s){var d=dev(s);return d!=null&&d>=.5})}
function level(sc){return sc<35?{t:"Steady",c:"var(--calm)",hex:"#6ee7c8",d:"You're close to your normal."}:sc<60?{t:"Drifting a little",c:"var(--warm)",hex:"#ffc773",d:"A few things are off your usual pattern."}:{t:"Drifting",c:"var(--hot)",hex:"#ff8a7a",d:"Several things moved away from your normal together."}}
function trend(){var out=[];for(var i=6;i>=0;i--)out.push(scoreFor(dkey(daysAgo(i))));return out}
function learned(){return loggedDays().filter(function(k){return k!==TODAY}).length}
function pickNudge(){
  var dr=drifting().map(function(s){return s.id});
  var best=null,bs=-1;
  NUDGES.forEach(function(n){var st=S.nudgeStats[n.id];var rel=n.rel.some(function(r){return dr.indexOf(r)>=0});
    var r=(st.done+1)/(st.done+st.skip+2)+(rel?.25:0);if(r>bs){bs=r;best=n}});
  return best.id;
}
/* after each check-in: if today is a real slide, offer one nudge (max one per day) */
function evaluate(){
  var sc=driftScore();
  if(sc!=null&&(sc>=60||drifting().length>=3)){
    if(!S.activeNudge||S.activeNudge.date!==TODAY){if(!S.nudgeLog.some(function(l){return l.date===TODAY})){S.activeNudge={id:pickNudge(),date:TODAY};save();return true}}
  }
  return false;
}
function nudgeText(n){
  if(n.id==="call"&&S.circle[0])return "You've been quieter with people than usual. A 5-minute call with "+esc(S.circle[0].name)+" could help.";
  if(n.id==="bed"){var b=SIGNALS[0],v=todayLog().bed,u=baseline(b,TODAY);if(v!=null&&u!=null)return "You went to sleep around "+fmt(b,v)+"; your usual is "+fmt(b,u)+". An earlier night tends to make tomorrow easier.";}
  if(n.id==="walk"){var s=SIGNALS[5],sv=todayLog().steps,su=baseline(s,TODAY);if(sv!=null&&su!=null)return "You logged "+fmt(s,sv)+" steps; your usual is about "+fmt(s,su)+". A short loop outside often resets the day.";}
  return n.d;
}

var I={
  today:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 14a8 8 0 0 1 16 0"/><path d="M12 14l4-4"/><circle cx="12" cy="14" r="1.5" fill="currentColor"/></svg>',
  trends:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-5 4 3 8-8"/><path d="M15 7h5v5"/></svg>',
  circle:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="9" r="3.2"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0"/><circle cx="17" cy="8" r="2.5"/><path d="M16 13.2A4.5 4.5 0 0 1 21 18"/></svg>',
  mood:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5a4.5 4.5 0 0 0 7 0"/><path d="M9 9.5h.01M15 9.5h.01"/></svg>'
};
function tabs(cur){
  var t=[["today","Today"],["trends","Trends"],["circle","Circle"],["mood","Check-in"]];
  document.getElementById("tabs").innerHTML=t.map(function(x){return '<button data-go="'+x[0]+'" class="'+(cur===x[0]?"on":"")+'">'+I[x[0]]+x[1]+'</button>'}).join("");
}
function header(){
  return '<div class="top"><div class="logo"><i></i>Drift</div><div class="row"><span class="pill" title="Your entries never leave this device">🔒 On this device</span><button class="help" data-go="crisis">Need help now?</button></div></div>';
}
var NOTE='<p class="disclaim">Personal, non-clinical self-tracking. Not a medical device and not a diagnosis.<br>Using Drift with patients or clients, or with real health records, would need a HIPAA review first.</p>';

function vOnboard(step){
  step=step||0;
  if(step===0)return '<div class="fade" style="padding-top:40px">'+
    '<div class="logo" style="font-size:22px"><i style="width:30px;height:30px"></i>Drift</div>'+
    '<h1 class="mt24" style="font-size:34px;line-height:1.1">Catch the slide<br>before it starts.</h1>'+
    '<p class="mt16">Drift learns what a normal week looks like for <b style="color:var(--text)">you</b>. Log a few numbers once a day. When several things shift at once, like sleep, steps, late-night scrolling, or going quiet with friends, it suggests one small thing to help you get back on track.</p>'+
    '<div class="card mt24"><div class="row"><div class="ico">🔒</div><div class="grow"><h3>You\'re in control</h3><p class="small mt8" style="font-size:13px">Every signal is opt-in and typed in by you. Everything stays in this browser on this device. Export or delete anytime.</p></div></div></div>'+
    '<div class="card mt12"><div class="row"><div class="ico">🤝</div><div class="grow"><h3>Support, not diagnosis</h3><p class="small mt8" style="font-size:13px">Drift is a personal wellness tool. It isn\'t a medical device and doesn\'t diagnose anything.</p></div></div></div>'+
    '<button class="btn mt24" data-ob="1">Get started</button>'+NOTE+'</div>';
  if(step===1)return '<div class="fade" style="padding-top:12px">'+
    '<p class="small">Step 1 of 2</p><h1 class="mt8">What will you track?</h1>'+
    '<p class="mt8">Turn on only what you\'re comfortable logging. More signals make it more accurate, but any mix of two or more works.</p>'+
    '<div class="card mt16 list" style="padding:4px 16px">'+CONSENTS.map(function(c){
      return '<div><div class="ico">'+c.ico+'</div><div class="grow"><h3>'+c.t+'</h3><div class="small" style="margin-top:2px">'+c.d+'</div></div><button class="tog '+(S.consents[c.id]?"on":"")+'" data-tog="'+c.id+'" aria-label="'+c.t+'"></button></div>'}).join("")+'</div>'+
    '<button class="btn mt16" data-ob="2">Continue</button></div>';
  var n=learned();
  return '<div class="fade" style="padding-top:12px">'+
    '<p class="small">Step 2 of 2</p><h1 class="mt8">Learning your normal</h1>'+
    '<p class="mt8">Log once a day (it takes about a minute). After '+MIN_DAYS+' days Drift starts comparing each day with your own usual. No nudges until it knows you.</p>'+
    '<div class="card mt16"><div class="row between"><h3>Baseline progress</h3></div><div class="bar" style="height:10px"><i style="width:'+Math.min(100,n/MIN_DAYS*100)+'%;background:linear-gradient(90deg,var(--calm),var(--sky))"></i></div><p class="small mt8">'+Math.min(n,MIN_DAYS)+' of '+MIN_DAYS+' days logged</p></div>'+
    '<div class="card mt12"><h3>What should Drift call you?</h3><input id="obName" class="mt12" placeholder="First name (optional)" maxlength="24" value="'+esc(S.name)+'"></div>'+

function gauge(sc){

    '<defs><linearGradient id="gg" x1="0" x2="1"><stop offset="0" stop-color="#6ee7c8"/><stop offset=".5" stop-color="#ffc773"/><stop offset="1" stop-color="#ff8a7a"/></linearGradient></defs>'+
    '<path d="M'+p0+' A'+R+' '+R+' 0 0 1 '+p1+'" stroke="#26315f" stroke-width="14" fill="none" stroke-linecap="round"/>'+
    '<path d="M'+p0+' A'+R+' '+R+' 0 0 1 '+bandEnd+'" stroke="rgba(110,231,200,.22)" stroke-width="26" fill="none"/>'+
    '<path d="M'+p0+' A'+R+' '+R+' 0 0 1 '+pv+'" stroke="url(#gg)" stroke-width="14" fill="none" stroke-linecap="round"/>'+
    '<circle cx="'+pv[0]+'" cy="'+pv[1]+'" r="9" fill="#0b1020" stroke="'+L.hex+'" stroke-width="4"/>'+

function download(name,text,type){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500)}
function reminderICS(){
  var d=new Date();d.setHours(21,0,0,0);function z(n){return("0"+n).slice(-2)}
  var st=d.getFullYear()+z(d.getMonth()+1)+z(d.getDate())+"T210000",en=d.getFullYear()+z(d.getMonth()+1)+z(d.getDate())+"T210500";

var route="",obStep=0,prev="today";
function go(r){if(r==="crisis"&&route!=="crisis")prev=route||"today";else if(r!=="crisis"&&route!=="crisis")prev=route||"today";route=r;render();var v=document.getElementById("view");v.scrollTop=0;
  var h="#"+r;if(location.hash!==h)history.replaceState(null,"",h)}
function render(){
  var tt=document.getElementById("toast");if(tt&&route!=="today")tt.classList.remove("show");
  var v=document.getElementById("view"),tb=document.getElementById("tabs"),ph=document.getElementById("phone");
  if(!S.onboarded&&route!=="crisis"){route="onboard"}
  var html;
  ph.className=route==="crisis"?"crisis":"";
  if(route==="onboard"){html=vOnboard(obStep);tb.style.display="none";v.className="scroll noTabs"}
  else if(route==="crisis"){html=vCrisis();tb.style.display="none";v.className="scroll noTabs"}
  else{tb.style.display="flex";v.className="scroll";tabs(route);

function afterLog(){var fresh=evaluate();save();if(fresh){go("today");setTimeout(showToast,400)}}
document.addEventListener("change",function(e){
  if(e.target&&e.target.id==="imp"){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var j=JSON.parse(r.result);if(!j||typeof j.logs!=="object")throw 0;var d=defaults();for(var k in d)if(j[k]===undefined)j[k]=d[k];S=j;save();render();alert("Imported "+loggedDays().length+" days.")}catch(x){alert("That file isn't a Drift export.")}};r.readAsText(f)}
});
document.addEventListener("click",function(e){
  var el=e.target.closest("[data-go],[data-ob],[data-tog],[data-act],[data-nudge],[data-mood],[data-rm],[data-back]");if(!el)return;
  var d=el.dataset;
  if(d.go){go(d.go);return}
  if(d.back){go(prev&&prev!=="crisis"&&prev!=="onboard"?prev:(S.onboarded?"today":"onboard"));return}
  if(d.ob){if(d.ob==="done"){var nm=document.getElementById("obName");if(nm)S.name=nm.value.trim();S.onboarded=true;save();go("today")}else{obStep=+d.ob;render();document.getElementById("view").scrollTop=0}return}
  if(d.tog){S.consents[d.tog]=!S.consents[d.tog];save();el.classList.toggle("on");return}
  if(d.nudge){var a=S.activeNudge;if(!a)return;var st=S.nudgeStats[a.id];
    if(d.nudge==="done")st.done++;else st.skip++;
    S.nudgeLog.push({id:a.id,r:d.nudge,t:Date.now(),date:TODAY});S.activeNudge=null;save();
    var c=document.getElementById("nudgeCard");
    if(c){c.innerHTML='<div class="row"><div class="ico" style="font-size:22px">'+(d.nudge==="done"?"🌱":"👌")+'</div><div class="grow"><h3>'+(d.nudge==="done"?"Nice. Logged as something that works for you.":"No problem. Drift will try something else next time.")+'</h3><p class="small" style="margin-top:2px">See <b>What works for you</b> in Trends.</p></div></div>'}
    return}
  if(d.mood){var l=S.logs[TODAY]||(S.logs[TODAY]={});l.mood=+d.mood;save();if(l.mood===1){go("crisis")}else{render();afterLog()}return}
  if(d.rm){if(!confirm("Remove "+S.circle[+d.rm].name+" from your Circle?"))return;S.circle.splice(+d.rm,1);save();render();return}
  if(d.act==="saveLog"){var lg=S.logs[TODAY]||(S.logs[TODAY]={});
    Array.prototype.forEach.call(document.querySelectorAll("[data-f]"),function(inp){var id=inp.dataset.f,v=inp.value;
      if(v===""){delete lg[id];return}
      if(inp.type==="time")lg[id]=timeToNum(v,id==="bed");else{var n=parseFloat(v);if(!isNaN(n)&&n>=0)lg[id]=n}});
    save();var sv=document.getElementById("saved");if(sv)sv.textContent="Saved for "+new Date().toLocaleDateString()+".";afterLog();return}
  if(d.act==="sendCircle"){S.circleSent=TODAY;save();setTimeout(render,300);return}
  if(d.act==="pause"){S.circlePaused=true;save();render();return}
  if(d.act==="unpause"){S.circlePaused=false;save();render();return}
  if(d.act==="addCircle"){var n=document.getElementById("cName").value.trim(),r=document.getElementById("cRel").value.trim(),p=document.getElementById("cPhone").value.trim();if(!n){document.getElementById("cName").focus();return}if(S.circle.length>=3)return;S.circle.push({name:n,rel:r||"Trusted person",phone:p});save();render();return}
  if(d.act==="saveName"){S.name=document.getElementById("setName").value.trim();save();render();return}
  if(d.act==="export"){download("drift-"+TODAY+".json",JSON.stringify(S,null,1),"application/json");return}
  if(d.act==="reminder"){download("drift-reminder.ics",reminderICS(),"text/calendar");return}
  if(d.act==="consents"){obStep=1;S.onboarded=false;save();render();return}
  if(d.act==="wipe"){if(!confirm("Delete all your Drift data from this browser? This can't be undone."))return;S=defaults();save();obStep=0;go("onboard");return}
});
